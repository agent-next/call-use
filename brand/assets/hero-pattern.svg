<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Repeating subtle waveform pattern -->
    <pattern id="waves" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Signal wave arcs -->
      <path d="M60 60 C80 40 80 20 60 0" stroke="#6366F1" stroke-width="0.8" fill="none" opacity="0.08"/>
      <path d="M80 60 C105 35 105 25 80 0" stroke="#6366F1" stroke-width="0.8" fill="none" opacity="0.05"/>
      <path d="M160 160 C180 140 180 120 160 100" stroke="#8B5CF6" stroke-width="0.8" fill="none" opacity="0.08"/>
      <path d="M180 160 C205 135 205 125 180 100" stroke="#8B5CF6" stroke-width="0.8" fill="none" opacity="0.05"/>
      <!-- Subtle dots at intersections -->
      <circle cx="60" cy="60" r="1.5" fill="#6366F1" opacity="0.1"/>
      <circle cx="160" cy="160" r="1.5" fill="#8B5CF6" opacity="0.1"/>
      <circle cx="60" cy="160" r="1" fill="#6366F1" opacity="0.06"/>
      <circle cx="160" cy="60" r="1" fill="#8B5CF6" opacity="0.06"/>
    </pattern>
    <!-- Grid underlay -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366F1" stroke-width="0.3" opacity="0.06"/>
    </pattern>
  </defs>
  <!-- Layer 1: grid -->
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- Layer 2: wave pattern -->
  <rect width="800" height="600" fill="url(#waves)"/>
  <!-- Radial fade so pattern is strongest in center -->
  <radialGradient id="fade" cx="50%" cy="50%" r="60%">
    <stop offset="0%" style="stop-color:transparent;stop-opacity:0"/>
    <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0.6"/>
  </radialGradient>
  <rect width="800" height="600" fill="url(#fade)"/>
</svg>
